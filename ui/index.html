<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Margin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="drag titlebar" data-tauri-drag-region></div>
      <div class="brand" data-tauri-drag-region>
        <img src="img/icon.png" alt="" class="brand-icon" />
        <span>Margin</span>
      </div>
      <button class="new-note" id="newNote" title="New note (⌘N)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
        New note
      </button>
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
        <input id="search" placeholder="Search notes" spellcheck="false" />
      </label>
      <nav class="lists" id="lists"></nav>
      <div class="sidebar-foot">
        <button class="ghost" id="openSettings" title="Settings (⌘,)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" /></svg>
          Settings
        </button>
        <span class="local-badge" title="Audio stays on this Mac">● On this Mac</span>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="drag topbar" data-tauri-drag-region></div>
      <div id="banner"></div>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
