[package]
name = "margin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first AI meeting notes"

[lib]
name = "margin_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
margin-core = { path = "../crates/margin-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
which = "8"
